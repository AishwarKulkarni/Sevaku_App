name: workzy
description: "Workzy — Home Services Marketplace"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI Enhancements
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1
  icons_plus: ^5.0.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  image_picker: ^1.1.2

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  path_provider: ^2.1.5
  firebase_messaging: ^15.2.3
  google_sign_in: ^6.2.2

  # Networking & Auth
  dio: ^5.9.2
  retrofit: ^4.9.2
  json_annotation: ^4.12.0
  flutter_secure_storage: ^10.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  retrofit_generator: ^10.2.6
  build_runner: ^2.15.0
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/logo/

  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend.ttf
